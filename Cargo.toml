[workspace]
resolver = "2"
members = ["crates/po-core", "crates/po-cli"]
# Tauri 壳是独立的构建单元（有自己的 tauri-build 与前端产物），不进这个 workspace
exclude = ["ui/src-tauri"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
sha1 = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "webp", "bmp", "gif", "tiff",
] }
fast_image_resize = "6"
kamadak-exif = "0.6"
